<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Railway Logs UI</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1d2736;
      --muted: #66758f;
      --line: #e1e7f0;
      --accent: #1565c0;
      --ok: #1b8a3f;
      --warn: #b28704;
      --err: #c62828;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Segoe UI, Tahoma, sans-serif;
      background: radial-gradient(circle at 20% 0%, #eaf2ff 0, var(--bg) 40%);
      color: var(--text);
    }
    .wrap {
      max-width: 1280px;
      margin: 24px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
      overflow: hidden;
    }
    .panel h2 {
      margin: 0;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      font-size: 16px;
    }
    .controls {
      display: grid;
      grid-template-columns: 1.1fr 0.8fr 0.8fr auto auto auto;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }
    input, select, button {
      height: 36px;
      border: 1px solid #c9d3e3;
      border-radius: 8px;
      padding: 0 10px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }
    button {
      cursor: pointer;
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
    }
    .meta {
      padding: 8px 16px;
      color: var(--muted);
      font-size: 12px;
      border-bottom: 1px solid var(--line);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid #eef2f8;
      vertical-align: top;
      text-align: left;
    }
    th {
      position: sticky;
      top: 0;
      background: #f7faff;
      z-index: 1;
      font-weight: 600;
    }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f3f8ff; }
    .tag {
      display: inline-block;
      min-width: 56px;
      text-align: center;
      font-size: 11px;
      border-radius: 999px;
      padding: 2px 8px;
      color: #fff;
      font-weight: 700;
    }
    .out { background: #455a64; }
    .in { background: #00897b; }
    .s2xx { color: var(--ok); font-weight: 700; }
    .s4xx { color: var(--warn); font-weight: 700; }
    .s5xx { color: var(--err); font-weight: 700; }
    .table-wrap { max-height: 72vh; overflow: auto; }
    pre {
      margin: 0;
      padding: 12px;
      font-size: 12px;
      line-height: 1.5;
      background: #0f1722;
      color: #d8e3f0;
      overflow: auto;
      max-height: 78vh;
      min-height: 78vh;
    }
    .hint {
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }
    @media (max-width: 1024px) {
      .wrap { grid-template-columns: 1fr; }
      pre { min-height: 44vh; max-height: 44vh; }
      .controls { grid-template-columns: 1fr 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <h2>Railway API Logs</h2>
      <div class="controls">
        <input id="q" placeholder="Search (action, message, route, FLG...)" />
        <select id="direction">
          <option value="">Direction: all</option>
          <option value="out">out</option>
          <option value="in">in</option>
        </select>
        <select id="status">
          <option value="">Status: all</option>
          <option value="2">2xx</option>
          <option value="4">4xx</option>
          <option value="5">5xx</option>
        </select>
        <button id="reload" class="primary">Reload</button>
        <button id="errors">Only errors</button>
        <button id="clear">Clear filters</button>
      </div>
      <div class="meta" id="meta">Loading...</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Time</th>
              <th>Dir</th>
              <th>Status</th>
              <th>Action</th>
              <th>Route</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>Entry Details</h2>
      <pre id="details">Select a row to inspect full JSON.</pre>
      <div class="hint">Default source file: ../logs/railway_requests.log</div>
    </section>
  </div>

  <script>
    const LOG_FILE = '../logs/railway_requests.log';
    let allEntries = [];

    const rowsEl = document.getElementById('rows');
    const detailsEl = document.getElementById('details');
    const metaEl = document.getElementById('meta');
    const qEl = document.getElementById('q');
    const directionEl = document.getElementById('direction');
    const statusEl = document.getElementById('status');

    const statusClass = (s) => {
      if (typeof s !== 'number') return '';
      if (s >= 500) return 's5xx';
      if (s >= 400) return 's4xx';
      if (s >= 200) return 's2xx';
      return '';
    };

    const parseJsonl = (text) => {
      const out = [];
      text.split(/\r?\n/).forEach((line, idx) => {
        if (!line.trim()) return;
        try {
          out.push({ _idx: idx + 1, ...JSON.parse(line) });
        } catch {
          out.push({ _idx: idx + 1, parse_error: true, raw: line });
        }
      });
      return out;
    };

    const shortMessage = (e) => {
      const body = e.body;
      if (body && typeof body === 'object' && body.message) return String(body.message).slice(0, 90);
      if (typeof body === 'string') return body.slice(0, 90);
      return '';
    };

    const entryAction = (e) => e?.payload?.answer?.action || '';
    const entryRoute = (e) => e?.payload?.answer?.route || '';

    function renderRows(list) {
      rowsEl.innerHTML = '';
      list.forEach((e, index) => {
        const tr = document.createElement('tr');
        const status = Number(e.status);
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${(e.ts || '').replace('T',' ').replace('Z','')}</td>
          <td><span class="tag ${e.direction || ''}">${e.direction || '-'}</span></td>
          <td class="${statusClass(status)}">${Number.isFinite(status) ? status : '-'}</td>
          <td>${entryAction(e)}</td>
          <td>${entryRoute(e)}</td>
          <td>${shortMessage(e)}</td>
        `;
        tr.addEventListener('click', () => {
          detailsEl.textContent = JSON.stringify(e, null, 2);
        });
        rowsEl.appendChild(tr);
      });
      metaEl.textContent = `entries: ${list.length} / ${allEntries.length}`;
    }

    function applyFilters() {
      const q = qEl.value.trim().toLowerCase();
      const direction = directionEl.value;
      const statusPrefix = statusEl.value;

      const filtered = allEntries.filter((e) => {
        if (direction && e.direction !== direction) return false;
        if (statusPrefix) {
          const s = String(e.status || '');
          if (!s.startsWith(statusPrefix)) return false;
        }
        if (q) {
          const blob = JSON.stringify(e).toLowerCase();
          if (!blob.includes(q)) return false;
        }
        return true;
      });

      renderRows(filtered);
    }

    async function loadData() {
      try {
        const res = await fetch(LOG_FILE, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        allEntries = parseJsonl(text);
        applyFilters();
      } catch (err) {
        rowsEl.innerHTML = '';
        detailsEl.textContent = 'Cannot load log file.\n\nRun server from L05 directory:\npython -m http.server 8000\n\nError: ' + err;
        metaEl.textContent = 'load failed';
      }
    }

    document.getElementById('reload').addEventListener('click', loadData);
    document.getElementById('errors').addEventListener('click', () => {
      statusEl.value = '4';
      applyFilters();
    });
    document.getElementById('clear').addEventListener('click', () => {
      qEl.value = '';
      directionEl.value = '';
      statusEl.value = '';
      applyFilters();
    });

    qEl.addEventListener('input', applyFilters);
    directionEl.addEventListener('change', applyFilters);
    statusEl.addEventListener('change', applyFilters);

    loadData();
  </script>
</body>
</html>
