<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L11 - Sensor Anomalies</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  header h1 { font-size: 1rem; color: #f0883e; }
  .badge { background: #21262d; border: 1px solid #30363d; border-radius: 4px; padding: 2px 8px; font-size: 0.75rem; }
  .badge.ok { border-color: #238636; color: #3fb950; }
  .badge.warn { border-color: #9e6a03; color: #d29922; }
  .badge.err { border-color: #da3633; color: #f85149; }
  main { display: grid; grid-template-columns: 300px 1fr; flex: 1; min-height: 0; }
  .sidebar { border-right: 1px solid #30363d; display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-header { padding: 10px; border-bottom: 1px solid #30363d; background: #161b22; }
  .sidebar-header h2 { font-size: 0.85rem; color: #8b949e; margin-bottom: 8px; }
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-family: monospace; }
  .filter-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .list { flex: 1; overflow-y: auto; }
  .list-item { padding: 8px 10px; border-bottom: 1px solid #21262d; cursor: pointer; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; }
  .list-item:hover { background: #161b22; }
  .list-item.selected { background: #1f3a5f; }
  .list-item .fid { color: #79c0ff; }
  .list-item .tags { display: flex; gap: 4px; }
  .tag { padding: 1px 5px; border-radius: 3px; font-size: 0.7rem; }
  .tag.prog { background: #5a1e02; color: #f0883e; }
  .tag.note { background: #1a3560; color: #79c0ff; }
  .pagination { padding: 8px; border-top: 1px solid #30363d; display: flex; gap: 6px; justify-content: center; }
  .pager-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-family: monospace; }
  .pager-btn:disabled { opacity: 0.4; cursor: default; }
  .detail { padding: 16px; overflow-y: auto; }
  .detail h2 { font-size: 0.9rem; color: #f0883e; margin-bottom: 12px; }
  .section { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
  .section h3 { font-size: 0.75rem; color: #8b949e; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  pre { font-size: 0.78rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .reason { background: #5a1e02; border-left: 3px solid #f0883e; padding: 4px 8px; margin: 4px 0; border-radius: 0 4px 4px 0; font-size: 0.75rem; }
  .note-prob { background: #1a3560; border-left: 3px solid #79c0ff; padding: 4px 8px; border-radius: 0 4px 4px 0; font-size: 0.75rem; }
  .stats { display: flex; gap: 12px; padding: 10px; background: #161b22; border-bottom: 1px solid #30363d; font-size: 0.75rem; }
  .stat { display: flex; flex-direction: column; align-items: center; }
  .stat .n { font-size: 1.2rem; color: #f0883e; }
  .stat .l { color: #8b949e; }
  .empty { padding: 20px; color: #8b949e; text-align: center; font-size: 0.85rem; }
  .verify-box { background: #0f2d0f; border: 1px solid #238636; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
  .verify-box.fail { background: #2d0f0f; border-color: #da3633; }
  .flags-panel { display: flex; gap: 12px; padding: 14px; background: #161b22; border-bottom: 1px solid #30363d; flex-wrap: wrap; }
  .flag-card { flex: 1; min-width: 180px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; }
  .flag-card h3 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #8b949e; margin-bottom: 6px; }
  .flag-value { font-size: 1rem; font-weight: bold; letter-spacing: 0.04em; color: #3fb950; word-break: break-all; }
  .flag-value.pending { color: #8b949e; font-size: 0.8rem; font-weight: normal; }
  .flag-meta { margin-top: 6px; font-size: 0.7rem; color: #8b949e; line-height: 1.4; }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>L11 &mdash; Sensor Anomaly Inspector</h1>
  <span class="badge" id="status-badge">loading...</span>
  <span class="badge" id="verify-badge" style="display:none"></span>
  <span class="badge" id="bonus-badge" style="display:none"></span>
</header>

<div class="flags-panel" id="flags-panel">
  <div class="flag-card">
    <h3>Main Flag &mdash; evaluation</h3>
    <div class="flag-value pending" id="flag-main">loading...</div>
    <div class="flag-meta" id="flag-main-meta"></div>
  </div>
  <div class="flag-card">
    <h3>Bonus Flag &mdash; 2137.json / TIMEGUARD</h3>
    <div class="flag-value pending" id="flag-bonus">loading...</div>
    <div class="flag-meta" id="flag-bonus-meta"></div>
  </div>
</div>

<main>
  <div class="sidebar">
    <div class="stats" id="stats">
      <div class="stat"><span class="n" id="s-total">-</span><span class="l">total</span></div>
      <div class="stat"><span class="n" id="s-prog">-</span><span class="l">programmatic</span></div>
      <div class="stat"><span class="n" id="s-note">-</span><span class="l">note only</span></div>
      <div class="stat"><span class="n" id="s-files">-</span><span class="l">files</span></div>
    </div>
    <div class="sidebar-header">
      <h2>Filter anomalies</h2>
      <div class="filter-row">
        <button class="filter-btn active" data-kind="all" onclick="setKind('all',this)">All</button>
        <button class="filter-btn" data-kind="programmatic" onclick="setKind('programmatic',this)">Programmatic</button>
        <button class="filter-btn" data-kind="note" onclick="setKind('note',this)">Note only</button>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <div class="detail" id="detail">
    <div class="empty">Select an anomaly from the list to inspect details.</div>
  </div>
</main>

<script>
let currentPage = 1;
let currentKind = 'all';
let selectedId = null;

async function api(path) {
  const r = await fetch(path);
  return r.json();
}

async function loadStatus() {
  const s = await api('/api/status');
  const badge = document.getElementById('status-badge');
  if (s.anomalies_ready) {
    badge.className = 'badge ok';
    badge.textContent = `${s.sensor_count} sensors loaded`;
  } else {
    badge.className = 'badge warn';
    badge.textContent = 'run task.py first';
  }
  if (s.anomalies_ready) loadAnomalies();

  const vr = await api('/api/verification');
  if (!vr.error) {
    const vb = document.getElementById('verify-badge');
    vb.style.display = '';
    if (vr.code === 0) {
      vb.className = 'badge ok';
      vb.textContent = 'Verified OK';
    } else {
      vb.className = 'badge err';
      vb.textContent = `Code ${vr.code}`;
    }
    // flags panel — main
    const fm = document.getElementById('flag-main');
    if (vr.code === 0 && vr.message) {
      fm.className = 'flag-value';
      fm.textContent = vr.message;
      document.getElementById('flag-main-meta').textContent = `52 anomalies submitted \u2022 code ${vr.code}`;
    } else if (vr.code !== undefined) {
      fm.className = 'flag-value pending';
      fm.textContent = `code ${vr.code}: ${vr.message || ''}`;
    }
  } else {
    document.getElementById('flag-main').textContent = 'run task.py first';
  }

  const br = await api('/api/bonus');
  if (!br.error) {
    const bb = document.getElementById('bonus-badge');
    bb.style.display = '';
    bb.className = 'badge ok';
    bb.textContent = `BONUS: ${br.flag}`;
    // flags panel — bonus
    const fb = document.getElementById('flag-bonus');
    fb.className = 'flag-value';
    fb.textContent = br.flag;
    document.getElementById('flag-bonus-meta').textContent =
      `file ${br.file_id}.json \u2022 a=${br.a} b=${br.b} \u2022 note: "${br.note_text.substring(0,50)}..."`;
  } else {
    document.getElementById('flag-bonus').textContent = 'run bonus_solver.py first';
  }
}

async function loadAnomalies() {
  const data = await api(`/api/anomalies?kind=${currentKind}&page=${currentPage}&per_page=50`);
  if (data.error) { document.getElementById('list').innerHTML = `<div class="empty">${data.error}</div>`; return; }

  const s = data.summary;
  document.getElementById('s-total').textContent = s.total;
  document.getElementById('s-prog').textContent = s.programmatic;
  document.getElementById('s-note').textContent = s.note;
  document.getElementById('s-files').textContent = s.total_files;

  const list = document.getElementById('list');
  list.innerHTML = data.items.map(item => {
    const tags = [];
    if (item.programmatic_reasons.length) tags.push('<span class="tag prog">P</span>');
    if (item.note_problem) tags.push('<span class="tag note">N</span>');
    const sel = item.id === selectedId ? ' selected' : '';
    return `<div class="list-item${sel}" onclick="loadDetail('${item.id}')">
      <span class="fid">${item.id}</span>
      <span class="tags">${tags.join('')}</span>
    </div>`;
  }).join('');

  // Pagination
  const total_pages = Math.ceil(data.total / data.per_page);
  const pg = document.getElementById('pagination');
  pg.innerHTML = `
    <button class="pager-btn" onclick="changePage(${currentPage-1})" ${currentPage===1?'disabled':''}>&#8592;</button>
    <span style="font-size:0.75rem;color:#8b949e">${currentPage} / ${total_pages}</span>
    <button class="pager-btn" onclick="changePage(${currentPage+1})" ${currentPage>=total_pages?'disabled':''}>&#8594;</button>
  `;
}

async function loadDetail(id) {
  selectedId = id;
  document.querySelectorAll('.list-item').forEach(el => {
    el.classList.toggle('selected', el.querySelector('.fid').textContent === id);
  });

  const detail = document.getElementById('detail');
  detail.innerHTML = '<div class="empty"><span class="spin">&#8635;</span> Loading...</div>';

  const d = await api(`/api/sensor?id=${id}`);
  if (d.error) { detail.innerHTML = `<div class="empty">${d.error}</div>`; return; }

  const data = d.data;
  const anomalies = d.anomalies;
  const hasProb = anomalies.programmatic_reasons.length > 0 || anomalies.note_problem;

  let html = `<h2>Sensor file: ${id}.json</h2>`;

  if (anomalies.programmatic_reasons.length) {
    html += `<div class="section"><h3>Programmatic Anomalies</h3>`;
    html += anomalies.programmatic_reasons.map(r => `<div class="reason">${r}</div>`).join('');
    html += '</div>';
  }
  if (anomalies.note_problem) {
    html += `<div class="section"><h3>Note Anomaly (operator reported problem, data is OK)</h3><div class="note-prob">${anomalies.note_problem}</div></div>`;
  }

  html += `<div class="section"><h3>Raw Data</h3><pre>${JSON.stringify(data, null, 2)}</pre></div>`;

  detail.innerHTML = html;
}

function setKind(kind, btn) {
  currentKind = kind;
  currentPage = 1;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
  loadAnomalies();
}

function changePage(p) {
  if (p < 1) return;
  currentPage = p;
  loadAnomalies();
}

loadStatus();
</script>
</body>
</html>
