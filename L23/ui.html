<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L23 · shellaccess</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
    header { background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 1.1rem; font-weight: 600; color: #f0f6fc; }
    header .badge { font-size: .75rem; padding: 2px 8px; border-radius: 20px; background: #388bfd22; color: #388bfd; border: 1px solid #388bfd55; }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 0; height: calc(100vh - 49px); }
    .panel { display: flex; flex-direction: column; border-right: 1px solid #30363d; overflow: hidden; }
    .panel:last-child { border-right: none; }
    .panel-header { background: #161b22; border-bottom: 1px solid #30363d; padding: 10px 16px; font-size: .8rem; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: .05em; display: flex; gap: 8px; align-items: center; }
    .panel-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    /* terminal */
    .terminal { background: #010409; border: 1px solid #30363d; border-radius: 6px; padding: 10px 12px; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: .78rem; }
    .terminal-input-row { display: flex; gap: 8px; }
    .terminal-input-row input { flex: 1; background: transparent; border: none; outline: none; color: #c9d1d9; font-family: inherit; font-size: inherit; }
    .terminal-input-row .run-btn { background: #238636; color: #fff; border: none; border-radius: 5px; padding: 4px 14px; cursor: pointer; font-size: .78rem; }
    .terminal-input-row .run-btn:disabled { opacity: .4; cursor: not-allowed; }
    .output-box { background: #010409; border: 1px solid #30363d; border-radius: 6px; padding: 10px 12px; flex: 1; overflow-y: auto; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: .75rem; white-space: pre-wrap; word-break: break-all; line-height: 1.5; color: #7ee787; min-height: 80px; }
    .output-box .err { color: #ff7b72; }
    /* presets */
    .presets { display: flex; flex-wrap: wrap; gap: 6px; }
    .preset-btn { font-size: .72rem; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
    .preset-btn:hover { background: #30363d; }
    /* findings */
    .kv-table { width: 100%; border-collapse: collapse; font-size: .72rem; }
    .kv-table th, .kv-table td { padding: 5px 8px; border-bottom: 1px solid #21262d; text-align: left; vertical-align: top; }
    .kv-table th { color: #8b949e; font-weight: 500; width: 38%; }
    .kv-table td { color: #c9d1d9; word-break: break-all; }
    /* submit */
    .submit-form { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; font-size: .78rem; }
    .submit-form label { color: #8b949e; }
    .submit-form input { background: #161b22; border: 1px solid #30363d; border-radius: 5px; padding: 5px 8px; color: #c9d1d9; font-size: .78rem; width: 100%; }
    .submit-form input:focus { outline: none; border-color: #388bfd; }
    .submit-row { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn { padding: 6px 16px; border: none; border-radius: 5px; cursor: pointer; font-size: .78rem; font-weight: 600; }
    .btn-green { background: #238636; color: #fff; }
    .btn-blue { background: #1f6feb; color: #fff; }
    .btn-orange { background: #bd561d; color: #fff; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    /* log */
    .log-entry { background: #161b22; border: 1px solid #21262d; border-radius: 5px; padding: 8px 10px; font-size: .72rem; }
    .log-entry .cmd-line { color: #79c0ff; margin-bottom: 4px; font-family: monospace; }
    .log-entry .resp-preview { color: #7ee787; white-space: pre-wrap; word-break: break-all; max-height: 100px; overflow: hidden; }
    .log-entry .ts { color: #484f58; font-size: .68rem; }
    /* flag card */
    .flag-card { background: #0f2a0b; border: 1px solid #2ea043; border-radius: 6px; padding: 12px 16px; }
    .flag-card h3 { color: #2ea043; font-size: .8rem; margin-bottom: 6px; }
    .flag-card .flag-val { font-family: monospace; font-size: .85rem; color: #7ee787; word-break: break-all; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-green { background: #2ea043; }
    .dot-yellow { background: #d29922; }
    .dot-gray { background: #484f58; }
    /* scroll bars */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    .split-right { display: flex; flex-direction: column; height: 100%; }
    .split-half { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #30363d; }
    .split-half:last-child { border-bottom: none; }
  </style>
</head>
<body>
<header>
  <h1>L23 · shellaccess</h1>
  <span class="badge" id="status-badge">ładowanie…</span>
</header>

<div class="layout">
  <!-- ===== LEWY PANEL: terminal + presets ===== -->
  <div class="panel">
    <div class="panel-header">
      <span class="status-dot dot-gray" id="term-dot"></span>
      Terminal — zdalny shell
    </div>
    <div class="panel-body">
      <!-- presets -->
      <div>
        <div style="font-size:.72rem; color:#8b949e; margin-bottom:6px;">Szybkie komendy:</div>
        <div class="presets" id="presets-row"></div>
      </div>

      <!-- input -->
      <div class="terminal">
        <div class="terminal-input-row">
          <span style="color:#484f58">$</span>
          <input id="cmd-input" placeholder="wpisz komendę…" autocomplete="off" spellcheck="false" />
          <button class="run-btn" id="run-btn" onclick="runCmd()">Run</button>
        </div>
      </div>

      <!-- output -->
      <div style="font-size:.72rem; color:#8b949e;">Ostatnia odpowiedź:</div>
      <div class="output-box" id="cmd-output">—</div>

      <!-- log -->
      <div style="font-size:.72rem; color:#8b949e; display:flex; justify-content:space-between;">
        Historia komend
        <button class="preset-btn" onclick="loadStatus()">Odśwież</button>
      </div>
      <div id="log-list" style="display:flex; flex-direction:column; gap:6px;"></div>
    </div>
  </div>

  <!-- ===== PRAWY PANEL: findings + submit ===== -->
  <div class="panel">
    <!-- górna połowa: findings + explore -->
    <div class="panel-header">Ustalenia pośrednie &amp; Submit</div>
    <div class="split-right">
      <div class="split-half">
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <button class="btn btn-blue" onclick="runExplore()" id="explore-btn">Uruchom Explore</button>
          <button class="preset-btn" onclick="loadStatus()">Odśwież dane</button>
          <span id="explore-status" style="font-size:.72rem; color:#8b949e;"></span>
        </div>

        <div id="flag-area"></div>

        <div style="font-size:.72rem; color:#8b949e;">findings.json</div>
        <div class="output-box" id="findings-box" style="max-height:220px; color:#c9d1d9;">—</div>
      </div>

      <!-- dolna połowa: submit -->
      <div class="split-half">
        <div style="font-size:.72rem; color:#8b949e; margin-bottom:4px;">
          Formularz finalnego submitu — wypełnij po ustaleniu danych, wyślij finalny JSON przez <code>echo</code> na shellu.
        </div>
        <div class="submit-form" id="submit-form">
          <label>date (YYYY-MM-DD)</label>
          <input type="text" id="f-date" placeholder="2020-01-01" />
          <label>city</label>
          <input type="text" id="f-city" placeholder="nazwa miasta" />
          <label>longitude</label>
          <input type="number" step="any" id="f-lon" placeholder="10.000001" />
          <label>latitude</label>
          <input type="number" step="any" id="f-lat" placeholder="12.345678" />
          <div class="submit-row">
            <button class="btn btn-green" onclick="previewSubmit()">Podgląd JSON</button>
            <button class="btn btn-orange" onclick="doSubmit()" id="submit-btn">Wyślij do huba</button>
          </div>
        </div>
        <div id="preview-box" style="display:none; margin-top:6px;">
          <div style="font-size:.72rem; color:#8b949e; margin-bottom:4px;">Komenda, która zostanie wysłana:</div>
          <div class="output-box" id="preview-cmd" style="color:#79c0ff; max-height:80px;"></div>
        </div>
        <div id="submit-result" style="display:none; margin-top:6px;">
          <div class="output-box" id="submit-output"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const PRESETS = [
  { label: "pwd", cmd: "pwd" },
  { label: "ls /data", cmd: "ls -la /data" },
  { label: "find /data", cmd: "find /data -type f | head -40" },
  { label: "ls /", cmd: "ls /" },
  { label: "grep Rafal", cmd: "grep -ril 'rafal\\|Rafał' /data 2>/dev/null | head -20" },
  { label: "grep znaleziono", cmd: "grep -ril 'znaleziono\\|ciało\\|found' /data 2>/dev/null | head -20" },
  { label: "grep date", cmd: "grep -roh '[0-9]\\{4\\}-[0-9]\\{2\\}-[0-9]\\{2\\}' /data 2>/dev/null | head -20" },
  { label: "grep coords", cmd: "grep -roi 'longitude\\|latitude\\|lon\\|lat' /data 2>/dev/null | head -20" },
  { label: "grep city", cmd: "grep -roi '\"city\"\\|\"miasto\"' /data 2>/dev/null | head -20" },
  { label: "jq /data/*.json", cmd: "find /data -name '*.json' -exec sh -c 'echo \"=== {} ===\"; cat {}' \\; 2>/dev/null | head -80" },
];

// Render presets
const pr = document.getElementById("presets-row");
PRESETS.forEach(p => {
  const b = document.createElement("button");
  b.className = "preset-btn";
  b.textContent = p.label;
  b.onclick = () => { document.getElementById("cmd-input").value = p.cmd; runCmd(); };
  pr.appendChild(b);
});

// CMD input enter
document.getElementById("cmd-input").addEventListener("keydown", e => {
  if (e.key === "Enter") runCmd();
});

async function runCmd() {
  const cmd = document.getElementById("cmd-input").value.trim();
  if (!cmd) return;
  const btn = document.getElementById("run-btn");
  btn.disabled = true;
  setDot("term-dot", "yellow");
  const out = document.getElementById("cmd-output");
  out.textContent = "…";
  try {
    const r = await fetch("/api/shell", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cmd }),
    });
    const data = await r.json();
    out.textContent = data.output || JSON.stringify(data, null, 2);
    setDot("term-dot", "green");
  } catch (e) {
    out.innerHTML = `<span class="err">${e.message}</span>`;
    setDot("term-dot", "gray");
  } finally {
    btn.disabled = false;
    loadStatus();
  }
}

async function runExplore() {
  const btn = document.getElementById("explore-btn");
  btn.disabled = true;
  document.getElementById("explore-status").textContent = "Uruchamianie…";
  try {
    const r = await fetch("/api/explore", { method: "POST" });
    const d = await r.json();
    document.getElementById("explore-status").textContent = d.status === "started" ? "Explorer uruchomiony (działa w tle)" : d.status;
    pollExplore();
  } catch (e) {
    document.getElementById("explore-status").textContent = `Błąd: ${e.message}`;
    btn.disabled = false;
  }
}

function pollExplore() {
  const iv = setInterval(async () => {
    const data = await (await fetch("/api/status")).json();
    const runner = data.runner || {};
    if (runner.status === "done" || runner.status === "error") {
      clearInterval(iv);
      document.getElementById("explore-btn").disabled = false;
      document.getElementById("explore-status").textContent = runner.status === "done" ? "Gotowe." : `Błąd: ${runner.error}`;
      renderFindings(data.findings);
    }
  }, 3000);
}

async function loadStatus() {
  try {
    const data = await (await fetch("/api/status")).json();
    renderLog(data.log || []);
    renderFindings(data.findings);
    renderVerification(data.verification);
  } catch (e) { /* ignore */ }
}

function renderLog(log) {
  const el = document.getElementById("log-list");
  el.innerHTML = "";
  [...log].reverse().forEach(entry => {
    const d = document.createElement("div");
    d.className = "log-entry";
    const resp = entry.response || {};
    const output = resp.output || resp.data || resp.message || "";
    const preview = typeof output === "string" ? output.slice(0, 200) : JSON.stringify(output).slice(0, 200);
    d.innerHTML = `
      <div class="ts">${entry.ts}</div>
      <div class="cmd-line">$ ${escHtml(entry.cmd)}</div>
      <div class="resp-preview">${escHtml(preview)}</div>`;
    el.appendChild(d);
  });
}

function renderFindings(findings) {
  const el = document.getElementById("findings-box");
  if (!findings) { el.textContent = "—"; return; }
  el.textContent = JSON.stringify(findings, null, 2);
}

function renderVerification(v) {
  const el = document.getElementById("flag-area");
  if (!v) { el.innerHTML = ""; return; }
  const msg = v.message || v.flag || JSON.stringify(v);
  el.innerHTML = `<div class="flag-card"><h3>Odpowiedź huba</h3><div class="flag-val">${escHtml(msg)}</div></div>`;
}

function previewSubmit() {
  const d = document.getElementById("f-date").value.trim();
  const c = document.getElementById("f-city").value.trim();
  const lon = parseFloat(document.getElementById("f-lon").value);
  const lat = parseFloat(document.getElementById("f-lat").value);
  if (!d || !c || isNaN(lon) || isNaN(lat)) { alert("Uzupełnij wszystkie pola."); return; }
  const obj = { date: d, city: c, longitude: lon, latitude: lat };
  const escaped = JSON.stringify(obj).replace(/'/g, "'\\''");
  document.getElementById("preview-cmd").textContent = `echo '${escaped}'`;
  document.getElementById("preview-box").style.display = "block";
}

async function doSubmit() {
  const d = document.getElementById("f-date").value.trim();
  const c = document.getElementById("f-city").value.trim();
  const lon = parseFloat(document.getElementById("f-lon").value);
  const lat = parseFloat(document.getElementById("f-lat").value);
  if (!d || !c || isNaN(lon) || isNaN(lat)) { alert("Uzupełnij wszystkie pola."); return; }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  document.getElementById("submit-result").style.display = "block";
  document.getElementById("submit-output").textContent = "…";
  try {
    const r = await fetch("/api/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date: d, city: c, longitude: lon, latitude: lat }),
    });
    const data = await r.json();
    document.getElementById("submit-output").textContent = JSON.stringify(data, null, 2);
    loadStatus();
  } catch (e) {
    document.getElementById("submit-output").textContent = `Błąd: ${e.message}`;
  } finally {
    btn.disabled = false;
  }
}

function setDot(id, color) {
  const el = document.getElementById(id);
  el.className = "status-dot " + (color === "green" ? "dot-green" : color === "yellow" ? "dot-yellow" : "dot-gray");
}

function escHtml(s) {
  if (typeof s !== "string") s = String(s);
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function updateBadge(text, ok) {
  const b = document.getElementById("status-badge");
  b.textContent = text;
  b.style.background = ok ? "#2ea04322" : "#bd561d22";
  b.style.color = ok ? "#2ea043" : "#f85149";
  b.style.borderColor = ok ? "#2ea04355" : "#f8514955";
}

// Polling statusu
setInterval(loadStatus, 8000);
loadStatus();
</script>
</body>
</html>
