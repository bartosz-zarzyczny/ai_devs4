<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>L15 — Savethem</title>
<style>
:root {
  --bg: #0a0a0a;
  --surface: #161616;
  --border: #3a3a3a;
  --text: #ffffff;
  --muted: #888;
  --accent: #75f86f;
  --accent-dim: rgba(117,248,111,0.12);
  --err: #ff8080;
  --warn: #f78c6c;
  --water: #4269a3;
  --rock: #a83232;
  --tree: #49644b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
  padding: 32px 16px;
  display: flex;
  justify-content: center;
}
.page { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 18px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; text-align: center; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 20px;
}
.card.success { border-color: var(--accent); background: linear-gradient(135deg, var(--accent-dim), transparent); }
.card.error { border-color: var(--err); }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 12px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.pill {
  font-family: monospace;
  font-size: 11px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--muted);
}
.pill.ok { border-color: var(--accent); color: var(--accent); }
.pill.err { border-color: var(--err); color: var(--err); }
.pill.warn { border-color: var(--warn); color: var(--warn); }
.flag { font-family: monospace; font-size: 20px; color: var(--accent); word-break: break-all; }
.flag.beaver { color: #c9a84c; }

/* Grid */
.grid-wrap { display: flex; justify-content: center; }
.grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 3px;
  width: min(100%, 380px);
}
.cell {
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  font-family: monospace;
  border: 1px solid var(--border);
  border-radius: 3px;
  position: relative;
  background: var(--surface);
  color: var(--muted);
  user-select: none;
}
.cell.open  { background: #1a1a1a; }
.cell.water { border-color: var(--water); color: #8fb8ff; background: rgba(26,49,88,.3); }
.cell.rock  { border-color: var(--rock); color: #ffd4d4; background: rgba(120,18,18,.3); }
.cell.tree  { border-color: var(--tree); color: #98d49c; background: rgba(32,64,36,.3); }
.cell.start { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.cell.goal  { border-color: #f7c948; color: #f7c948; background: rgba(247,201,72,.1); }
.cell.beaver-spot { border-color: #c9a84c; color: #c9a84c; background: rgba(201,168,76,.1); }
.cell.path  { background: rgba(117,248,111,.07); }
.step-num {
  position: absolute; top: 1px; right: 2px;
  font-size: 8px; color: var(--muted); opacity: .7;
}

/* Legend */
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.leg-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.leg-swatch {
  width: 16px; height: 16px;
  border-radius: 3px;
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
}

/* Route list */
.route-list { font-family: monospace; font-size: 13px; line-height: 1.7; word-break: break-all; color: var(--muted); }
.route-list .veh   { color: var(--accent); font-weight: bold; }
.route-list .dis   { color: var(--warn); }
.route-list .dir   { color: var(--text); }
.route-list .bstep { color: #c9a84c; font-weight: bold; }
</style>
</head>
<body>
<div class="page">
  <h1>L15 — Savethem</h1>

  <div class="card" id="statusCard">
    <div class="label">Status weryfikacji</div>
    <div class="pills">
      <span class="pill" id="codePill">—</span>
      <span class="pill" id="stepsPill">— kroków</span>
      <span class="pill" id="fuelPill">Paliwo: —</span>
      <span class="pill" id="foodPill">Jedzenie: —</span>
    </div>
    <div class="flag" id="flagText"></div>
    <div class="flag beaver" id="beaverFlagText" style="margin-top:8px;"></div>
  </div>

  <div class="card">
    <div class="label">Mapa 10×10</div>
    <div class="grid-wrap">
      <div class="grid" id="grid"></div>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="card" id="routeCard">
    <div class="label">Trasa</div>
    <div class="route-list" id="routeList">—</div>
  </div>
</div>

<script>
const MAP = [
  ['.','.','.','.','.','.','.','.',  'W','W'],
  ['.','.','.','.','.','.','.','W','W',  '.'],
  ['.','T','.','.','.','.','W','W',  '.', '.'],
  ['.','.','.','.','.','.','W',  '.', '.', '.'],
  ['.','.','T','.','.','.','W',  '.', 'G',  '.'],
  ['.','.','.','.','R','.','W',  '.', '.', '.'],
  ['.','.','.','R','R','.','W','W',  '.', '.'],
  ['S','R','.','.','.','.','.',  'W', '.', '.'],
  ['.','.','.','.','.','.','W','W',  '.', '.'],
  ['.','.','.','.','.','W','W',  '.', '.', '.'],
];

// Backend uses 1-indexed: beaver_spot (row:2,col:7) = 0-indexed (1,6)
const BEAVER = { row: 1, col: 6 };
const START  = { row: 7, col: 0 };
const GOAL   = { row: 4, col: 8 };

// Known routes:
const MAIN_ROUTE   = ['rocket','up','right','right','up','right','up','right','right','dismount','right','right','right'];
const BEAVER_ROUTE = ['rocket','up','up','up','up','up','up','right','right','right','dismount','right','right','right'];

function cellClass(val, r, c) {
  if (val === 'W') return 'water';
  if (val === 'R') return 'rock';
  if (val === 'T') return 'tree';
  if (val === 'S') return 'start';
  if (val === 'G') return 'goal';
  return 'open';
}

function traceRoute(steps) {
  // Return array of {row,col} visited (movement only, 0-indexed)
  const visited = [];
  let r = START.row, c = START.col;
  for (const s of steps) {
    if (s === 'up')    r--;
    else if (s === 'down')  r++;
    else if (s === 'left')  c--;
    else if (s === 'right') c++;
    else continue; // vehicle name or dismount
    visited.push({ row: r, col: c });
  }
  return visited;
}

function buildGrid(pathCells, beaverOnPath) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  // Build step numbers for path
  const stepMap = {};
  pathCells.forEach((p, i) => { stepMap[`${p.row},${p.col}`] = i + 1; });

  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 10; c++) {
      const val = MAP[r][c];
      const cell = document.createElement('div');
      const key = `${r},${c}`;
      const cls = cellClass(val, r, c);
      const isPath = key in stepMap;
      const isBeaver = r === BEAVER.row && c === BEAVER.col;

      cell.className = 'cell ' + cls + (isPath ? ' path' : '') + (isBeaver ? ' beaver-spot' : '');

      let icon = val === '.' ? '' : val;
      if (val === 'W') icon = '🌊';
      else if (val === 'R') icon = '🪨';
      else if (val === 'T') icon = '🌲';
      else if (val === 'S') icon = '🏁';
      else if (val === 'G') icon = '🎯';
      if (isBeaver && icon === '') icon = '🦫';

      cell.textContent = icon;

      if (isPath) {
        const n = document.createElement('span');
        n.className = 'step-num' + (isBeaver ? ' bstep' : '');
        n.textContent = stepMap[key];
        cell.appendChild(n);
      }

      grid.appendChild(cell);
    }
  }
}

function buildLegend() {
  const items = [
    { cls: 'start', icon: '🏁', label: 'Start (S)' },
    { cls: 'goal',  icon: '🎯', label: 'Cel (G)' },
    { cls: 'beaver-spot', icon: '🦫', label: 'Bobry' },
    { cls: 'water', icon: '🌊', label: 'Woda (W)' },
    { cls: 'rock',  icon: '🪨', label: 'Skała (R)' },
    { cls: 'tree',  icon: '🌲', label: 'Drzewo (T)' },
    { cls: 'path',  icon: '', label: 'Trasa' },
  ];
  const legend = document.getElementById('legend');
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'leg-item';
    div.innerHTML = `<div class="leg-swatch cell ${it.cls}">${it.icon}</div><span>${it.label}</span>`;
    legend.appendChild(div);
  });
}

function renderRoute(steps) {
  const el = document.getElementById('routeList');
  const parts = steps.map((s, i) => {
    if (i === 0) return `<span class="veh">${s}</span>`;
    if (s === 'dismount') return `<span class="dis">${s}</span>`;
    return `<span class="dir">${s}</span>`;
  });
  el.innerHTML = parts.join(' ');
}

function computeResources(steps) {
  const costs = { rocket: [1.0, 0.1], car: [0.7, 1.0], horse: [0.0, 1.6], walk: [0.0, 2.5] };
  let fuel = 10, food = 10, mode = 'walk';
  for (const s of steps) {
    if (s in costs) { mode = s; continue; }
    if (s === 'dismount') { mode = 'walk'; continue; }
    if (s === 'up' || s === 'down' || s === 'left' || s === 'right') {
      fuel -= costs[mode][0];
      food -= costs[mode][1];
    }
  }
  return { fuel: Math.round(fuel * 100) / 100, food: Math.round(food * 100) / 100 };
}

function init() {
  const vr = null; // will load from API
  const route = MAIN_ROUTE;
  const pathCells = traceRoute(route);
  const beaverOnPath = pathCells.some(p => p.row === BEAVER.row && p.col === BEAVER.col);

  buildGrid(pathCells, beaverOnPath);
  buildLegend();
  renderRoute(route);

  const res = computeResources(route);
  document.getElementById('stepsPill').textContent = (route.length - 2) + ' kroków';
  document.getElementById('fuelPill').textContent   = `Paliwo: ${(10 - res.fuel).toFixed(1)} / 10`;
  document.getElementById('foodPill').textContent   = `Jedzenie: ${(10 - res.food).toFixed(1)} / 10`;

  // Load verification result
  fetch('/api/state')
    .then(r => r.json())
    .then(data => {
      const code = data.code;
      const msg  = String(data.message || '');
      const card = document.getElementById('statusCard');
      const pill = document.getElementById('codePill');
      const flagEl = document.getElementById('flagText');

      pill.textContent = code === 0 ? 'Sukces (code 0)' : `Code: ${code}`;
      pill.className = 'pill ' + (code === 0 ? 'ok' : 'err');
      card.className = 'card ' + (code === 0 ? 'success' : 'error');

      const match = msg.match(/\{FLG:[A-Z0-9]+\}/);
      if (match) flagEl.textContent = match[0];
    })
    .catch(() => {});

  // Beaver bonus flag display
  document.getElementById('beaverFlagText').textContent = '{FLG:ABEAVER}';
}

init();
</script>
</body>
</html>
