<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L06 Categorize UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-card: #1a1d27;
            --bg-accent: #232736;
            --text-main: #f1f2f6;
            --text-muted: #8b95a5;
            --primary: #5e6ad2;
            --primary-hover: #6c78e6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        header {
            grid-column: 1 / -1;
            padding: 1rem 0;
            border-bottom: 1px solid var(--bg-accent);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #a5b4fc, #818cf8);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .badge {
            background-color: var(--bg-accent);
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 500;
            border: 1px solid #374151;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--bg-accent);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 500;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: var(--bg-dark);
            border: 1px solid var(--bg-accent);
            border-radius: 8px;
            padding: 1rem;
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: auto;
        }

        button {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--bg-accent);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #2d3346;
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }
        
        .btn-success:hover {
            background-color: #059669;
            transform: translateY(-1px);
        }

        .log-container {
            background-color: #090a0f;
            border: 1px solid var(--bg-accent);
            border-radius: 8px;
            padding: 1rem;
            height: 300px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #a9b5c7;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .result-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--bg-accent);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .r-id { font-weight: 600; }
        .r-status { font-size: 0.75rem; color: var(--text-muted); }
        .r-ans { 
            font-family: 'JetBrains Mono', monospace; 
            padding: 0.25rem 0.5rem; 
            background: var(--bg-accent); 
            border-radius: 4px;
            display: inline-block;
            margin-top: 0.5rem;
        }
        
        .ok { color: var(--success); }
        .err { color: var(--danger); }
        .flg { color: var(--warning); font-weight: bold; }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Categorize Agent UI</h1>
            <div class="badge" id="app-status">Ready</div>
        </header>
        
        <!-- Extracted Flag Area -->
        <div id="flag-container" style="display: none; grid-column: 1 / -1; background: linear-gradient(135deg, #f59e0b, #d97706); padding: 1.5rem; border-radius: 12px; text-align: center; color: white; font-size: 1.5rem; font-weight: bold; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);">
            NO FLAG YET
        </div>

        <!-- Prompt Config -->
        <div class="card">
            <div class="card-title">Prompt Configuration</div>
            <div>
                <label for="prompt">System Prompt</label>
                <textarea id="prompt" placeholder="Loading prompt..."></textarea>
            </div>
            <div class="actions">
                <button class="btn-secondary" onclick="savePrompt()">Save Prompt</button>
                <button class="btn-success" onclick="runTask()">▶ Run Task</button>
            </div>
        </div>

        <!-- CLI Output -->
        <div class="card">
            <div class="card-title">Console Output</div>
            <div class="log-container" id="cli-output"></div>
        </div>

        <!-- Debug Prompt Info -->
        <div class="card">
            <div class="card-title">Sent Prompts (Debug)</div>
            <div class="log-container" id="debug-output"></div>
        </div>

        <!-- Visualization -->
        <div class="card">
            <div class="card-title">Results Visualization</div>
            <div class="results-grid" id="results-grid"></div>
        </div>
    </div>

    <script>
        let pollInterval;

        window.onload = () => {
            fetchPrompt();
        };

        async function fetchPrompt() {
            try {
                const res = await fetch('/api/prompt');
                const data = await res.json();
                document.getElementById('prompt').value = data.prompt;
            } catch (e) {
                console.error("Failed to fetch prompt", e);
            }
        }

        async function savePrompt() {
            const prompt = document.getElementById('prompt').value;
            const btn = document.querySelector('.btn-secondary');
            
            try {
                await fetch('/api/prompt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                btn.textContent = "Saved ✓";
                btn.style.color = "var(--success)";
                setTimeout(() => {
                    btn.textContent = "Save Prompt";
                    btn.style.color = "";
                }, 2000);
            } catch (e) {
                console.error("Failed to save", e);
                alert("Failed to save prompt");
            }
        }

        async function runTask() {
            document.getElementById('app-status').textContent = "Running...";
            document.getElementById('app-status').style.color = "var(--warning)";
            
            // clear old stuff
            document.getElementById('cli-output').innerHTML = "Started...\n";
            document.getElementById('debug-output').innerHTML = "";
            document.getElementById('results-grid').innerHTML = "";
            
            // push latest prompt first implicitly
            await savePrompt();

            try {
                await fetch('/api/run', { method: 'POST' });
                pollInterval = setInterval(fetchLogs, 1000);
            } catch (e) {
                console.error(e);
            }
        }

        async function fetchLogs() {
            try {
                const res = await fetch('/api/logs');
                const data = await res.json();
                
                const cliNode = document.getElementById('cli-output');
                if (data.out) {
                    cliNode.textContent = data.out;
                    cliNode.scrollTop = cliNode.scrollHeight;
                }

                if (data.out && data.out.includes("WIN! FLAG:")) {
                    clearInterval(pollInterval);
                    document.getElementById('app-status').textContent = "Completed! Win!";
                    document.getElementById('app-status').style.color = "var(--success)";
                } else if (data.out && data.out.includes("ERROR! Stopping")) {
                    clearInterval(pollInterval);
                    document.getElementById('app-status').textContent = "Error Stopped.";
                    document.getElementById('app-status').style.color = "var(--danger)";
                }

                const dbgNode = document.getElementById('debug-output');
                if (data.debug) {
                    dbgNode.textContent = data.debug;
                    dbgNode.scrollTop = dbgNode.scrollHeight;
                }

                renderResults(data.results);
            } catch (e) {
                console.error("Poll error", e);
            }
        }

        function renderResults(resArr) {
            const grid = document.getElementById('results-grid');
            grid.innerHTML = "";
            let foundFlag = null;
            if (!resArr || !resArr.length) return;

            resArr.forEach(item => {
                const el = document.createElement('div');
                el.className = 'result-card';
                
                let isOk = [200, 202].includes(item.status) && [0,1,2].includes(item.res.code);
                let klass = isOk ? 'ok' : 'err';
                let flagTxt = item.res.message && item.res.message.includes("{FLG:") ? `<div class="flg">${item.res.message}</div>` : '';
                if (item.res.message && item.res.message.includes("{FLG:")) {
                    foundFlag = item.res.message;
                }
                
                let outStr = item.res?.debug?.output || 'No output details';
                
                el.innerHTML = `
                    <div class="r-id">📦 ${item.id}</div>
                    <div class="r-status ${klass}">Status: ${item.status} | Code: ${item.res.code}</div>
                    <div class="r-ans">${outStr}</div>
                    ${flagTxt}
                `;
                grid.appendChild(el);
            });
            
            const flagContainer = document.getElementById("flag-container");
            if (foundFlag) {
                flagContainer.style.display = "block";
                flagContainer.textContent = "🏆 ZNALEZIONO FLAGĘ: " + foundFlag;
            } else {
                flagContainer.style.display = "none";
            }
        }
    </script>
</body>
</html>
